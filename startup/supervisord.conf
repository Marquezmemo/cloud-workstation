[supervisord]
nodaemon=true
logfile=/var/log/workstation/supervisord.log
pidfile=/var/run/workstation-supervisord.pid
childlogdir=/var/log/workstation

[unix_http_server]
file=/var/run/workstation-supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/workstation-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
startsecs=2
stdout_logfile=/var/log/workstation/sshd.log
stderr_logfile=/var/log/workstation/sshd.err.log

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
startsecs=2
stdout_logfile=/var/log/workstation/dbus.log
stderr_logfile=/var/log/workstation/dbus.err.log

[program:gdm]
command=/usr/local/bin/start-gdm.sh
autorestart=false
startsecs=5
startretries=1
stdout_logfile=/var/log/workstation/gdm.stdout.log
stderr_logfile=/var/log/workstation/gdm.stderr.log

[program:desktop-probe]
command=/usr/local/bin/desktop-probe-loop.sh
autorestart=true
startsecs=2
stdout_logfile=/var/log/workstation/desktop-probe.stdout.log
stderr_logfile=/var/log/workstation/desktop-probe.stderr.log
