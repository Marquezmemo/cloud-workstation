name: Publish Headless Surveyor Dev

on:
  push:
    branches:
      - headless-surveyor-v0.1-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish headless surveyor dev image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/preparar-escena tests/*.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build headless surveyor dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev
          labels: |
            org.opencontainers.image.title=cloud-workstation
            org.opencontainers.image.version=headless-surveyor-v0.1-dev
            org.opencontainers.image.description=Headless COLMAP image for photogrammetry reconstruction before Gaussian Splatting training.
            org.opencontainers.image.base.name=colmap/colmap:20240723.601@sha256:73003557e3ffa36d801e71b7630c117f9d373c55f24e3afc6791b9b3d1ec01da
            io.cloud-workstation.colmap.version=3.10
            io.cloud-workstation.colmap.commit=0bd66d901c7549051e21e8f648777f802eb20a73
            io.cloud-workstation.cuda.version=12.3.1
            io.cloud-workstation.ubuntu.version=22.04
            io.cloud-workstation.gdown.version=6.1.0

      - name: Validate image tools without GPU
        run: |
          docker run --rm \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev \
            validate-surveyor.sh

      - name: Test Surveyor scene contract
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev \
            /tests/test-surveyor-contract.sh

      - name: Test Surveyor manifest generation
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev \
            /tests/test-survey-scene-manifest.sh

      - name: Test ZIP scene preparation
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev \
            /tests/test-preparar-escena.sh

      - name: Push validated headless surveyor dev
        run: docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev
