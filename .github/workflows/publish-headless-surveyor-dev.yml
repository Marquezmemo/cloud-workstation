name: Publish Headless Surveyor Dev

on:
  push:
    branches:
      - headless-surveyor-v0.1-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish headless surveyor dev image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push headless surveyor dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-surveyor-v0.1-dev
          labels: |
            org.opencontainers.image.title=cloud-workstation
            org.opencontainers.image.version=headless-surveyor-v0.1-dev
            org.opencontainers.image.description=Headless COLMAP image for photogrammetry reconstruction before Gaussian Splatting training.
            org.opencontainers.image.base.name=colmap/colmap@sha256:187ca5ec98e55ed8fbec5f43f9d8f78b7a322b3b7413356634191f7a43c1efcf
