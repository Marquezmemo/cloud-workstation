name: Publish Headless gsplat Dev

on:
  push:
    branches:
      - headless-gsplat-v0.1-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish headless gsplat dev image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push headless gsplat dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:headless-gsplat-v0.1-dev
          labels: |
            org.opencontainers.image.title=cloud-workstation
            org.opencontainers.image.version=headless-gsplat-v0.1-dev
            org.opencontainers.image.description=Headless CUDA/PyTorch image with pinned gsplat import baseline.
            org.opencontainers.image.base.name=runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04@sha256:61a4aafb0094cd773f11eefa378929d5a687bd775febeb78eac62fc824141fb5
            io.cloud-workstation.gsplat.version=1.5.3
            io.cloud-workstation.gsplat.source=PyPI
