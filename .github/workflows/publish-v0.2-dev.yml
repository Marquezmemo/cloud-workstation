name: Publish Workstation v0.2-dev

on:
  push:
    branches:
      - workstation-v0.2-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push v0.2-dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-workstation:v0.2-dev
          labels: |
            org.opencontainers.image.title=cloud-workstation
            org.opencontainers.image.version=v0.2-dev
            org.opencontainers.image.base.name=runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04@sha256:6878d595cd929b97acb8cce666c3db7e6709971547d46b2d94362460695f5b29
